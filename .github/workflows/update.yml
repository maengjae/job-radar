name: 채용 공고 갱신

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.json", "scripts/**", "docs/data/curated.json"]

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 수집
        run: python scripts/collect.py
      - name: 변경 사항 커밋
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "공고 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
