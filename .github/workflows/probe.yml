name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q requests 2>/dev/null || true
          python scripts/collect.py > out.txt 2>&1; tail -5 out.txt
          python3 -c "
          import json
          s=json.load(open('docs/data/status.json')); print('STATUS', [x for x in (s if isinstance(s,list) else s.get('sources',[])) if '한화' in json.dumps(x,ensure_ascii=False)])
          j=json.load(open('docs/data/jobs.json')); jobs=j if isinstance(j,list) else j.get('jobs',[])
          for x in jobs:
            if 'hanwhain' in x.get('url',''): print('HJ', x.get('company'),'|',x.get('title'),'|',x.get('role'),'|',x.get('deadline'),'|',x.get('url'))
          "
